<div class="overview-container">
  <skyra-page-header
    title="Observability Overview"
    description="Real-time operational pulse, log intake volume, and exception telemetry across your workspace."
  >
    <div header-actions class="header-badges">
      <span class="scope-tag font-mono">Tenant: {{ context().tenantId }}</span>
      <span class="scope-tag font-mono">Project: {{ context().projectId }}</span>
    </div>
  </skyra-page-header>

  <!-- Error Banner if RFC 7807 occurred -->
  @if (error()) {
    <div class="error-banner" role="alert">
      <div class="error-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      </div>
      <div class="error-content">
        <div class="error-title">{{ error() }}</div>
        @if (errorCorrelationId()) {
          <div class="error-correlation font-mono">Correlation ID: {{ errorCorrelationId() }}</div>
        }
      </div>
      <button type="button" class="retry-btn" (click)="onRefresh()">Retry</button>
    </div>
  }

  <!-- Operational Filter & Telemetry Toolbar -->
  <skyra-analytics-toolbar
    [timeRange]="timeRange()"
    [environment]="environment()"
    [showIntervalSelector]="false"
    [loading]="loading()"
    [refreshing]="refreshing()"
    [lastUpdated]="lastUpdated()"
    [executionTimeMs]="kpis().executionTimeMs"
    [scannedBytes]="kpis().scannedBytes"
    (timeRangeChange)="onTimeRangeChange($event)"
    (environmentChange)="onEnvironmentChange($event)"
    (refresh)="onRefresh()"
    (customRangeApply)="onCustomRangeApply($event)"
  />

  <!-- Authoritative KPI Cards Grid -->
  <div class="kpi-grid">
    <skyra-metric-card
      label="Total Logs"
      [value]="kpis().totalLogs"
      description="Authorized events in time window"
      badgeText="Authorized"
      badgeVariant="neutral"
      [isClickable]="true"
      (cardClick)="onExploreAllLogs()"
    />

    <skyra-metric-card
      label="Exceptions & Errors"
      [value]="kpis().errorCount"
      [description]="'Fatal and error level events (' + kpis().errorRatePercent + '%)'"
      [badgeText]="kpis().errorRatePercent + '% Error Rate'"
      [badgeVariant]="kpis().errorCount > 0 ? 'error' : 'success'"
      [isClickable]="true"
      (cardClick)="onExploreErrors()"
    />

    <skyra-metric-card
      label="Warnings"
      [value]="kpis().warningCount"
      description="Events requiring attention"
      badgeText="Warn Level"
      badgeVariant="warning"
      [isClickable]="true"
      (cardClick)="onExploreWarnings()"
    />

    <skyra-metric-card
      label="Active Services"
      [value]="kpis().activeServicesCount"
      description="Distinct emitting service.name"
      [badgeText]="context().projectId"
      badgeVariant="brand"
      [isClickable]="true"
      (cardClick)="onExploreAllLogs()"
    />
  </div>

  <!-- Primary Time-Series Visualization -->
  <div class="primary-chart-section">
    <skyra-time-series-chart
      title="Ingestion & Volume Trend"
      subtitle="Aggregated event intake over the active window. Click any bar to investigate window in Log Explorer."
      [points]="volumeTrend()"
      [loading]="loading()"
      (bucketClick)="onBucketSelect($event)"
    />
  </div>

  <!-- Secondary Breakdown Section -->
  <div class="secondary-grid">
    <!-- Severity Distribution -->
    <skyra-severity-chart
      title="Severity Distribution"
      subtitle="Breakdown by canonical log level. Click any level to drill down."
      [items]="severityDistribution()"
      (levelClick)="onExploreLevel($event)"
    />

    <!-- Top Services -->
    <skyra-service-distribution
      title="Top Reporting Services"
      subtitle="Ranked by volume intake. Click any service to inspect."
      [items]="serviceDistribution()"
      (serviceClick)="onExploreService($event)"
    />
  </div>
</div>
