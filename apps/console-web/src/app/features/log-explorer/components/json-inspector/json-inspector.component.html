<div class="json-inspector">
  <div class="json-header">
    <span class="json-badge font-mono">JSON</span>
    <button
      type="button"
      class="copy-btn"
      (click)="copyRawJson()"
      [attr.aria-label]="copied() ? 'Copied to clipboard' : 'Copy JSON to clipboard'"
    >
      @if (copied()) {
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="20 6 9 17 4 12" />
        </svg>
        <span>Copied!</span>
      } @else {
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
        </svg>
        <span>Copy</span>
      }
    </button>
  </div>

  <div class="json-body font-mono" tabindex="0" role="region" aria-label="Structured JSON inspector">
    <pre class="json-pre"><code>{{ formatValue(data()) }}</code></pre>
  </div>
</div>
