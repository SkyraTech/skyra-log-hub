<div class="explorer-container">
  <!-- Page Header with Active Workspace Context -->
  <skyra-page-header
    title="Log Explorer"
    description="Real-time live log investigation workstation with keyset pagination, dynamic facets, and deep inspection."
  >
    <div header-actions class="header-context-tags">
      @if (context(); as ctx) {
        <span class="context-badge font-mono" title="Active Tenant">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          </svg>
          {{ ctx.tenantId }}
        </span>
        <span class="context-badge font-mono project-badge" title="Active Project">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2" />
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" />
          </svg>
          {{ ctx.projectId }}
        </span>
      }
    </div>
  </skyra-page-header>

  <!-- Search Toolbar -->
  <skyra-search-toolbar
    [queryText]="queryText()"
    [timeRange]="timeRange()"
    [pageSize]="pagination().pageSize"
    [loading]="loading()"
    (queryTextChange)="onQueryTextChange($event)"
    (timeRangeChange)="onTimeRangeChange($event)"
    (pageSizeChange)="onPageSizeChange($event)"
    (search)="onSearch()"
    (cancel)="onCancel()"
  />

  <!-- Dynamic Filter & Facets Panel -->
  <skyra-filter-panel
    [facets]="facets()"
    [selectedLevels]="selectedLevels()"
    [selectedServices]="selectedServices()"
    [selectedEnvironments]="selectedEnvironments()"
    [filterChips]="filterChips()"
    (levelToggle)="onLevelToggle($event)"
    (serviceToggle)="onServiceToggle($event)"
    (envToggle)="onEnvToggle($event)"
    (chipRemove)="onChipRemove($event)"
    (clearAll)="onClearAll()"
    (refreshFacets)="onRefreshFacets()"
  />

  <!-- Query Status, Metrics & Pagination -->
  <skyra-query-status
    [statistics]="statistics()"
    [pagination]="pagination()"
    [loading]="loading()"
    [error]="error()"
    [correlationId]="errorCorrelationId()"
    (prevPage)="onPrevPage()"
    (nextPage)="onNextPage()"
  />

  <!-- Primary Results Area -->
  <div class="results-wrapper">
    <skyra-log-table
      [logs]="rows()"
      [loading]="loading()"
      [density]="tableDensity()"
      [selectedId]="selectedRow()?.id || null"
      (rowSelect)="onRowSelect($event)"
      (densityChange)="onDensityChange($event)"
    />
  </div>

  <!-- Event Detail Drawer -->
  <skyra-log-event-drawer
    [log]="selectedRow()"
    [isOpen]="selectedRow() !== null"
    [loading]="detailLoading()"
    [error]="detailError()"
    (close)="closeDrawer()"
  />
</div>
