<div class="analytics-container">
  <skyra-page-header
    title="Analytics & Telemetry Explorer"
    description="Multi-dimensional faceted analysis, time-series distributions, and error classifications across your workspace."
  >
    <div header-actions class="header-badges">
      <span class="scope-tag font-mono">Tenant: {{ context().tenantId }}</span>
      <span class="scope-tag font-mono">Project: {{ context().projectId }}</span>
    </div>
  </skyra-page-header>

  <!-- Error Banner if RFC 7807 occurred -->
  @if (error()) {
    <div class="error-banner" role="alert">
      <div class="error-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      </div>
      <div class="error-content">
        <div class="error-title">{{ error() }}</div>
        @if (errorCorrelationId()) {
          <div class="error-correlation font-mono">Correlation ID: {{ errorCorrelationId() }}</div>
        }
      </div>
      <button type="button" class="retry-btn" (click)="onRefresh()">Retry</button>
    </div>
  }

  <!-- Analytical Controls Toolbar -->
  <skyra-analytics-toolbar
    [timeRange]="timeRange()"
    [interval]="interval()"
    [environment]="environment()"
    [showIntervalSelector]="true"
    [loading]="loading()"
    [refreshing]="refreshing()"
    [lastUpdated]="lastUpdated()"
    [executionTimeMs]="kpis().executionTimeMs"
    [scannedBytes]="kpis().scannedBytes"
    (timeRangeChange)="onTimeRangeChange($event)"
    (intervalChange)="onIntervalChange($event)"
    (environmentChange)="onEnvironmentChange($event)"
    (refresh)="onRefresh()"
    (customRangeApply)="onCustomRangeApply($event)"
  />

  <!-- Top KPI Metrics -->
  <div class="kpi-grid">
    <skyra-metric-card
      label="Total Scanned Events"
      [value]="kpis().totalLogs"
      description="Authorized logs evaluated"
      badgeText="DuckDB"
      badgeVariant="neutral"
      [isClickable]="true"
      (cardClick)="onExploreAllLogs()"
    />

    <skyra-metric-card
      label="Error & Fatal Volume"
      [value]="kpis().errorCount"
      [description]="kpis().errorRatePercent + '% of analyzed traffic'"
      [badgeText]="kpis().errorRatePercent + '% Error Rate'"
      [badgeVariant]="kpis().errorCount > 0 ? 'error' : 'success'"
      [isClickable]="true"
      (cardClick)="onExploreErrors()"
    />

    <skyra-metric-card
      label="Warnings"
      [value]="kpis().warningCount"
      description="Non-critical warning logs"
      badgeText="Warn Level"
      badgeVariant="warning"
      [isClickable]="true"
      (cardClick)="onExploreWarnings()"
    />

    <skyra-metric-card
      label="Unique Services"
      [value]="kpis().activeServicesCount"
      description="Cardinality on service.name"
      [badgeText]="context().projectId"
      badgeVariant="brand"
      [isClickable]="true"
      (cardClick)="onExploreAllLogs()"
    />
  </div>

  <!-- Primary Time-Series Volume Chart -->
  <div class="chart-section">
    <skyra-time-series-chart
      title="High-Resolution Time Series"
      [subtitle]="'Event intake rate grouped by ' + interval() + ' intervals. Click any bar to drill down.'"
      [points]="volumeTrend()"
      [loading]="loading()"
      (bucketClick)="onBucketSelect($event)"
    />
  </div>

  <!-- 3-Column Distribution Grid -->
  <div class="distribution-grid">
    <!-- Severity Breakdown -->
    <skyra-severity-chart
      title="Severity Breakdown"
      subtitle="Canonical ECS log.level"
      [items]="severityDistribution()"
      (levelClick)="onExploreLevel($event)"
    />

    <!-- Top Reporting Services -->
    <skyra-service-distribution
      title="Top Services"
      subtitle="Volume by service.name"
      [items]="serviceDistribution()"
      (serviceClick)="onExploreService($event)"
    />

    <!-- Top Exception Types -->
    <skyra-error-breakdown
      title="Top Exception Types"
      subtitle="Grouped by error.type"
      [items]="errorBreakdown()"
      (errorClick)="onExploreErrorType($event)"
    />
  </div>

  <!-- Event Actions Dimension Breakdown -->
  @if (eventActionBreakdown().length > 0) {
    <div class="actions-section">
      <skyra-service-distribution
        title="Event Actions Distribution"
        subtitle="Ranked by event.action"
        [items]="eventActionBreakdown()"
      />
    </div>
  }
</div>
