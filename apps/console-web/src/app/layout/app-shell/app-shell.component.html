<skyra-tech-app-shell
  [attr.collapsed]="sidebarCollapsed() ? '' : null"
  [attr.mobile-open]="mobileNavOpen() ? '' : null">
  <!-- Desktop & Mobile Slotted Sidebar -->
  <div slot="sidebar" style="height: 100%; display: flex; flex-direction: column;">
    <skyra-sidebar
      [collapsed]="sidebarCollapsed()"
      (toggleCollapse)="toggleSidebar()"
    />
  </div>

  <!-- Sticky Application Topbar Header -->
  <div slot="header" style="height: 100%; width: 100%;">
    <skyra-topbar (toggleMobileNav)="toggleMobileNav()" />
  </div>

  <!-- Primary Main Content Outlet -->
  <main id="main-content" class="content-outlet" tabindex="-1">
    <router-outlet />
  </main>
</skyra-tech-app-shell>
