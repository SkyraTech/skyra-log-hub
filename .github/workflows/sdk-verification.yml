name: Skyra LogHub — Cross-SDK Verification & Release Gate

on:
  push:
    branches: [main, master, 'release/**']
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-and-contracts:
    name: Schema Sync & Contract Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Canonical Schema Synchronization
        run: pnpm check:schema-sync

      - name: Run Schema Contract Tests
        run: pnpm test:contracts

  typescript-sdks:
    name: TypeScript SDKs (Build, Typecheck, Unit Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Strict TypeScript Compilation
        run: pnpm build

      - name: Workspace Strict Typecheck
        run: pnpm typecheck

      - name: Run Node.js SDK Unit & Reliability Tests
        run: pnpm test:node

      - name: Run NestJS SDK Interceptor & Context Tests
        run: pnpm test:nestjs

      - name: Run Next.js Server & Route Handler Tests
        run: pnpm test:next

      - name: Run Browser Core SDK Tests
        run: pnpm test:browser

      - name: Run Angular Integration Tests
        run: pnpm test:angular

      - name: Run React Integration Tests
        run: pnpm test:react

  python-sdk-matrix:
    name: Python SDK (${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python Package Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build jsonschema>=4.20.0

      - name: Run Python Unit, Concurrency, and Interop Tests
        run: python -m unittest discover -s packages/logger-python/tests

      - name: Build Wheel & Source Distribution
        run: python -m build packages/logger-python

  browser-e2e:
    name: Browser E2E Automation (Chromium)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false

      - name: Install Dependencies & Build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Run Real Browser E2E Test Suite
        run: node tests/e2e/real-browser.test.mjs

  isolated-distribution-check:
    name: Isolated Consumer & Tarball Installation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false

      - name: Install Dependencies & Build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          python -m pip install --upgrade pip build

      - name: Pack All Artifacts
        run: |
          pnpm --filter @skyra/logger-browser pack
          pnpm --filter @skyra/logger-angular pack
          pnpm --filter @skyra/logger-react pack
          python -m build packages/logger-python

      - name: Verify Isolated Browser / Angular / React Consumer
        run: node scripts/verify_isolated_browser_consumer.mjs

      - name: Verify Isolated Python Consumer
        run: python scripts/verify_isolated_python_consumer.py
