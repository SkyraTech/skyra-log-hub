openapi: 3.1.0
info:
  title: Implemented project-scoped credential management (FEATURE-004)
  version: 1.0.0
  description: >-
    Admin requires a short-lived trusted BFF assertion with the matching credentials operation scope.
    Membership and capabilities are resolved from PostgreSQL, not browser/provider role claims.
    All responses use Cache-Control no-store, Pragma no-cache and Referrer-Policy no-referrer.
    BFF exposes the same suffixes at /bff/projects/{projectId}/credentials, derives tenant from
    the session, and requires CSRF and allowed Origin on mutations.
security:
  - TrustedAssertion: []
paths:
  /admin/v1/tenants/{tenantId}/projects/{projectId}/credentials:
    parameters:
      - {$ref: '#/components/parameters/Tenant'}
      - {$ref: '#/components/parameters/Project'}
    get:
      operationId: listManagedCredentials
      summary: Safe, project-scoped credential metadata
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 100}, description: 'Name, credential UUID or issuance request UUID'}
        - {name: status, in: query, schema: {enum: [ACTIVE, EXPIRED, REVOKED]}}
        - {name: sort, in: query, schema: {enum: [createdAt, description], default: createdAt}}
        - {name: direction, in: query, schema: {enum: [asc, desc], default: desc}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: cursor, in: query, schema: {type: string}, description: Opaque bounded cursor bound to filters, actor and project}
      responses:
        '200':
          description: Safe page; never rawToken or keyHash
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor, canCreate, project]
                properties:
                  items: {type: array, items: {$ref: './managed-credential-response.schema.json'}}
                  nextCursor: {type: [string, 'null']}
                  canCreate: {type: boolean}
                  project: {type: object, required: [id, name, status], properties: {id: {type: string}, name: {type: string}, status: {enum: [ACTIVE, SUSPENDED, ARCHIVED]}}}
        '400': {description: Invalid filter or cursor}
        '401': {description: Invalid trusted assertion or session}
        '403': {description: Missing capability or project assignment}
        '404': {description: Tenant or project not accessible}
        '503': {description: Safe persistence unavailable response}
    post:
      operationId: createManagedCredential
      summary: Issue a 256-bit CSPRNG bearer secret once
      parameters:
        - {$ref: '#/components/parameters/RequestId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './managed-credential-request.schema.json'}
      responses:
        '201': {$ref: '#/components/responses/Issued'}
        '400': {description: Invalid body or missing UUID Idempotency-Key}
        '401': {description: Authentication required}
        '403': {description: Capability or CSRF denied}
        '404': {description: Scope not accessible}
        '409': {description: 'Inactive project or request already processed. Read metadata and revoke an unconfigured key; secrets cannot be recovered.'}
        '503': {description: Persistence or audit unavailable; review issuance request metadata}
  /admin/v1/tenants/{tenantId}/projects/{projectId}/credentials/{credentialId}:
    parameters:
      - {$ref: '#/components/parameters/Tenant'}
      - {$ref: '#/components/parameters/Project'}
      - {$ref: '#/components/parameters/Credential'}
    get:
      operationId: readManagedCredential
      responses:
        '200':
          description: Metadata only; ETag equals version
          headers: {ETag: {schema: {type: string}}}
          content: {application/json: {schema: {$ref: './managed-credential-response.schema.json'}}}
        '401': {description: Authentication required}
        '403': {description: Capability denied}
        '404': {description: Not accessible}
        '503': {description: Persistence unavailable}
  /admin/v1/tenants/{tenantId}/projects/{projectId}/credentials/{credentialId}/rotate:
    parameters:
      - {$ref: '#/components/parameters/Tenant'}
      - {$ref: '#/components/parameters/Project'}
      - {$ref: '#/components/parameters/Credential'}
    post:
      operationId: replaceManagedCredential
      description: >-
        One replacement per source. Both keys work until explicitly revoked or expired.
        Scope and rate are inherited; remaining expiry is not extended. Source must be active.
      parameters:
        - {$ref: '#/components/parameters/Version'}
        - {$ref: '#/components/parameters/RequestId'}
      requestBody: {$ref: '#/components/requestBodies/EmptyCommand'}
      responses:
        '201': {$ref: '#/components/responses/Issued'}
        '400': {description: Invalid body or precondition}
        '401': {description: Authentication required}
        '403': {description: Capability or CSRF denied}
        '404': {description: Not accessible}
        '409': {description: Stale version, inactive project, expired/revoked/already-replaced source or reused request}
        '428': {description: If-Match required}
        '503': {description: Persistence or audit unavailable; review issuance metadata}
  /admin/v1/tenants/{tenantId}/projects/{projectId}/credentials/{credentialId}/revoke:
    parameters:
      - {$ref: '#/components/parameters/Tenant'}
      - {$ref: '#/components/parameters/Project'}
      - {$ref: '#/components/parameters/Credential'}
    post:
      operationId: revokeManagedCredential
      description: >-
        Permanent. Inactive-project revocation remains available. Replay returns metadata without
        another audit. New Gateway authentication after commit rejects; already authenticated work may finish.
      parameters:
        - {$ref: '#/components/parameters/Version'}
      requestBody: {$ref: '#/components/requestBodies/EmptyCommand'}
      responses:
        '200':
          description: Revoked metadata and fresh ETag
          content: {application/json: {schema: {$ref: './managed-credential-response.schema.json'}}}
        '400': {description: Invalid body or version}
        '401': {description: Authentication required}
        '403': {description: Capability or CSRF denied}
        '404': {description: Not accessible}
        '409': {description: Stale version}
        '428': {description: If-Match required}
        '503': {description: Persistence or audit unavailable}
components:
  securitySchemes:
    TrustedAssertion: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Tenant: {name: tenantId, in: path, required: true, schema: {type: string, format: uuid}}
    Project: {name: projectId, in: path, required: true, schema: {type: string}}
    Credential: {name: credentialId, in: path, required: true, schema: {type: string, format: uuid}}
    Version: {name: If-Match, in: header, required: true, schema: {type: string}, description: 'Exact version from latest metadata response'}
    RequestId: {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}, description: 'Single issuance nonce; retry cannot recover secret or mint a second key'}
  requestBodies:
    EmptyCommand:
      required: true
      content: {application/json: {schema: {type: object, additionalProperties: false}}}
  responses:
    Issued:
      description: 'Metadata plus rawToken returned only by successful create/rotate; never retrievable again. Save to application secret configuration.'
      headers: {Cache-Control: {schema: {type: string, const: no-store}}, ETag: {schema: {type: string}}}
      content:
        application/json:
          schema: {$ref: './managed-credential-issued.schema.json'}
